# Blueprint do Render. Banco fica no Neon (DATABASE_URL configurada manualmente no painel).
# Versão do Python: lida do arquivo .python-version.
services:
  - type: web
    name: studio-fitness
    runtime: python
    plan: starter            # "free" funciona, mas dorme após 15 min sem acesso
    region: virginia         # mesma região do banco no Neon (aws us-east-1) — cada consulta cruza a rede
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /contas/login/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # colar a connection string do Neon
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # ex.: https://studiofitness.com.br
      - key: ALLOWED_HOSTS
        sync: false          # ex.: studiofitness.com.br,www.studiofitness.com.br
      # Assistente da agenda (chat com LLM) — ver apps/assistente/ e CLAUDE.md.
      # "True" fixo aqui (em vez de sync:false) é proposital: com sync:false
      # um "Sync Blueprint" no painel do Render sobrescreveria de volta pro
      # valor daqui de qualquer forma, então o botão flutuante só continua
      # ativo se o valor do blueprint já for "True". O assistente ainda
      # depende de GROQ_API_KEY/GEMINI_API_KEY (abaixo, sync:false) estar
      # preenchida no painel — sem nenhuma chave, ele fica inativo mesmo
      # com ASSISTENTE_ATIVO=True (ver config/settings.py).
      - key: ASSISTENTE_ATIVO
        value: "True"
      - key: LLM_PROVEDORES
        value: "groq,gemini"  # ordem de tentativa; Groq primeiro (ver README, seção de privacidade)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: LLM_TIMEOUT_S
        value: "12"
