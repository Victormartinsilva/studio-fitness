{% extends "base.html" %}
{% load static %}
{% block title %}Entrar — Studio Fitness{% endblock %}
{% block content %}
<div class="login">
    <img class="logo" src="{% static 'img/logo.png' %}" alt="Studio Fitness">
    <div>
        <h1 style="margin-bottom:4px">Entrar</h1>
        <p class="sub">Acesse sua agenda do studio.</p>
    </div>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-bloco">Entrar</button>
    </form>
</div>
{% endblock %}
