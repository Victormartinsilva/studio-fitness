<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Studio Fitness{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        header { background: #222; color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; }
        header a { color: #fff; text-decoration: none; margin-right: 1rem; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #fff; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .alerta { padding: .5rem .75rem; border-left: 4px solid #2b7de9; background: #eaf2fd; margin-bottom: .5rem; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <div>
            <a href="{% url 'painel:home' %}">Studio Fitness</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'agenda:minhas_sessoes' %}">Agenda</a>
            {% endif %}
        </div>
        <div>
            {% if request.user.is_authenticated %}
                <span>{{ request.user.first_name|default:request.user.username }}</span>
                <form method="post" action="{% url 'contas:logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#fff;cursor:pointer;text-decoration:underline;">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'contas:login' %}">Entrar</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
